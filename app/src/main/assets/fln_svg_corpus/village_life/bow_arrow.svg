  <!-- Arrowhead -->
  <polygon points="82,44 94,50 82,56" fill="#64748B" stroke="#334155" stroke-width="1.5"/>
  <!-- Arrow fletching/feathers -->
  <line x1="20" y1="44" x2="26" y2="50" stroke="#DC2626" stroke-width="2"/>
  <line x1="20" y1="56" x2="26" y2="50" stroke="#DC2626" stroke-width="2"/>
  <line x1="14" y1="44" x2="20" y2="50" stroke="#DC2626" stroke-width="2"/>
  <line x1="14" y1="56" x2="20" y2="50" stroke="#DC2626" stroke-width="2"/>
</svg>
