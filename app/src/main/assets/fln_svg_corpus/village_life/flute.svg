<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g transform="rotate(-30 50 50)">
    <!-- Bamboo flute body -->
    <rect x="10" y="44" width="80" height="12" rx="4" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5"/>
    <!-- Bamboo segments -->
    <line x1="24" y1="44" x2="24" y2="56" stroke="#A16207" stroke-width="2"/>
    <line x1="76" y1="44" x2="76" y2="56" stroke="#A16207" stroke-width="2"/>
    <!-- Blow hole -->
    <ellipse cx="18" cy="50" rx="3" ry="2" fill="#78350F"/>
    <!-- Finger tone holes -->
    <circle cx="36" cy="50" r="2.5" fill="#78350F"/>
    <circle cx="46" cy="50" r="2.5" fill="#78350F"/>
    <circle cx="54" cy="50" r="2.5" fill="#78350F"/>
    <circle cx="62" cy="50" r="2.5" fill="#78350F"/>
    <circle cx="70" cy="50" r="2.5" fill="#78350F"/>
  </g>
</svg>
