  <!-- Head -->
  <circle cx="50" cy="46" r="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
  <!-- Tall Ears -->
  <ellipse cx="40" cy="20" rx="6" ry="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5" transform="rotate(-10 40 20)"/>
  <ellipse cx="40" cy="20" rx="3" ry="11" fill="#FBCFE8" transform="rotate(-10 40 20)"/>
  <ellipse cx="60" cy="20" rx="6" ry="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5" transform="rotate(10 60 20)"/>
  <ellipse cx="60" cy="20" rx="3" ry="11" fill="#FBCFE8" transform="rotate(10 60 20)"/>
  <!-- Eyes -->
