<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Peacock (Marak') -->
  <!-- Fan of plumage feathers -->
  <path d="M50 78 C20 72 12 40 28 20 C42 6 62 10 74 24 C88 42 80 72 50 78 Z" 
        fill="#0D9488" stroke="#0F766E" stroke-width="2.5"/>
  <!-- Feather eye-spots -->
  <circle cx="30" cy="30" r="5.5" fill="#0284C7" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="50" cy="20" r="5.5" fill="#0284C7" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="70" cy="30" r="5.5" fill="#0284C7" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="24" cy="50" r="5.5" fill="#0284C7" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="76" cy="50" r="5.5" fill="#0284C7" stroke="#FBBF24" stroke-width="2"/>
  <!-- Peacock blue body and neck -->
  <path d="M46 82 C42 72 44 54 48 46 C50 42 54 40 56 42 C58 44 56 50 54 58 C52 68 56 78 54 82 Z" 
        fill="#0284C7" stroke="#0369A1" stroke-width="2.5"/>
  <!-- Head and crest -->
  <circle cx="55" cy="38" r="6" fill="#0284C7"/>
  <polygon points="60,37 68,39 60,41" fill="#F59E0B"/>
  <circle cx="56" cy="37" r="1.5" fill="#FFFFFF"/>
  <line x1="55" y1="32" x2="52" y2="25" stroke="#0284C7" stroke-width="1.8"/>
  <line x1="55" y1="32" x2="56" y2="24" stroke="#0284C7" stroke-width="1.8"/>
  <circle cx="52" cy="24" r="2" fill="#0D9488"/>
  <circle cx="56" cy="23" r="2" fill="#0D9488"/>
</svg>
