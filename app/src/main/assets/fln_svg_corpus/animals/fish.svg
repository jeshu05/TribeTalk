<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fish (Haku) -->
  <!-- Tail fin -->
  <polygon points="14,32 30,50 14,68" fill="#38BDF8" stroke="#0284C7" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Fish body -->
  <path d="M26 50 C36 28 66 28 86 50 C66 72 36 72 26 50 Z" 
        fill="#0EA5E9" stroke="#0369A1" stroke-width="3" stroke-linejoin="round"/>
  <!-- Dorsal fin -->
  <path d="M46 32 C54 22 62 24 66 33 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
  <!-- Pectoral fin -->
  <path d="M50 52 C56 58 58 64 54 66 C48 64 48 58 50 52 Z" fill="#7DD3FC" stroke="#0284C7" stroke-width="1.8"/>
  <!-- Eye -->
  <circle cx="74" cy="46" r="4.5" fill="#FFFFFF"/>
  <circle cx="75.5" cy="46" r="2.5" fill="#0F172A"/>
  <!-- Gills curve -->
  <path d="M64 40 C66 48 66 54 64 60" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
  <!-- Water bubbles -->
  <circle cx="88" cy="38" r="2.5" fill="#BAE6FD"/>
  <circle cx="92" cy="32" r="1.8" fill="#BAE6FD"/>
</svg>
